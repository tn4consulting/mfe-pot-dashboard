frontend:
  name: dashboard
  replicaCount: 1
  image:
    repository: mfe-pot-dashboard
    tag: latest
    pullPolicy: IfNotPresent
  containerPort: 80
  servicePort: 80
  # benefitAggregationBffBaseUrl is same-origin (this app's own BFF, via
  # the /api Ingress path rule below) -- see CLAUDE.md's Hosting section.
  # Empty, not "/api": HttpBenefitOverviewApiClient/HttpPaymentHistoryApiClient
  # already append "/api/..." themselves (`${baseUrl}/api/overview`), so
  # this value is just "this app's own origin" -- shared-runtime-config's
  # fetchRuntimeConfig resolves "" to that origin. A literal "/api" here
  # double-prefixes every request to /api/api/... and 404s.
  # strapiBaseUrl/clientProfileServiceBaseUrl point at services that stay
  # in the platform repo (Strapi CMS, client-profile-service) which don't
  # have their own charts built yet (see the platform repo's plan doc) --
  # left as plausible in-cluster Service DNS names; calls to them will
  # fail to resolve until those charts exist, which dashboard's own
  # ContentClient/data-access layers are designed to degrade against, not
  # a regression introduced by this extraction.
  runtimeConfig:
    benefitAggregationBffBaseUrl: ""
    strapiBaseUrl: "http://strapi.default.svc.cluster.local:1337"
    clientProfileServiceBaseUrl: "http://client-profile-service.default.svc.cluster.local:3003"

backend:
  name: benefit-aggregation-bff
  replicaCount: 1
  image:
    repository: mfe-pot-benefit-aggregation-bff
    tag: latest
    pullPolicy: IfNotPresent
  containerPort: 3004
  servicePort: 3004
  # JOB_BANK_BFF_URL/EMPLOYMENT_INSURANCE_BFF_URL point at real sibling
  # Helm releases' in-cluster Services (job-bank-bff, employment-insurance-bff
  # -- each already a Deployment+Service pair from its own extracted
  # repo's chart), not their public Ingress hostnames -- this is genuine
  # cluster-internal service-to-service traffic. CLIENT_PROFILE_SERVICE_URL
  # has no deployed Service yet (see frontend.runtimeConfig comment above);
  # that upstream call fails and degrades gracefully per overview.ts's
  # existing partial-failure contract.
  env:
    HOST: "0.0.0.0"
    PORT: "3004"
    JOB_BANK_BFF_URL: "http://job-bank-bff.default.svc.cluster.local:3001"
    EMPLOYMENT_INSURANCE_BFF_URL: "http://employment-insurance-bff.default.svc.cluster.local:3002"
    CLIENT_PROFILE_SERVICE_URL: "http://client-profile-service.default.svc.cluster.local:3003"

ingress:
  host: dashboard.mfe-pot.local
  className: nginx
